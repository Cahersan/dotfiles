# tmux configuration
#
# Symlinked to ~/.config/tmux/tmux.conf (tmux >= 3.1 reads the XDG path).
# Plugins are managed by TPM: https://github.com/tmux-plugins/tpm
# Reload with `prefix r`, install plugins with `prefix I`.

# --- Terminal and colors ---------------------------------------------------

set -g default-terminal "tmux-256color"
# Pass 24-bit color through to the outer terminal
set -as terminal-features ",*:RGB"
# Forward focus events so editors can react (e.g. autoreload on focus)
set -g focus-events on
# Don't wait after Escape, so Vim mode switches feel instant
set -sg escape-time 10

# --- General ---------------------------------------------------------------

set -g mouse on
set -g history-limit 50000
set -g display-time 2000
# Number windows and panes from 1, so they match the keyboard layout
set -g base-index 1
setw -g pane-base-index 1
# Close the gap when a window is closed (1 2 3 instead of 1 3)
set -g renumber-windows on
# Resize to the smallest client actually looking at the window
setw -g aggressive-resize on

# --- Key bindings ----------------------------------------------------------

# Prefix is ctrl-a; press it twice to send ctrl-a to the shell (start of line)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Splits and new windows open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode -------------------------------------------------------------

# Vi keys in copy mode, to match Vim mode in Zed
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# Send copied text to the system clipboard via OSC 52 (tmux-yank adds wl-copy)
set -g set-clipboard on
# Mouse selections go to the primary selection, `y` (tmux-yank) to the
# clipboard, like other Linux apps. The selection stays highlighted, so `y`
# right after a drag copies it to the clipboard too.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy --primary"
# Middle click pastes the system primary selection (last text selected in any
# app) instead of tmux's own buffer. Apps that use the mouse get the click.
bind -n MouseDown2Pane select-pane -t= \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  { send -M } \
  { run "wl-paste --primary --no-newline | tmux load-buffer -b primary - && tmux paste-buffer -p -d -b primary -t '#{pane_id}'" }

# --- Status bar ------------------------------------------------------------

set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[default] ,}%H:%M "
setw -g window-status-current-style "fg=cyan,bold"
set -g pane-active-border-style "fg=cyan"

# --- Plugins ---------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Keep the selection highlighted after `y` instead of jumping out
set -g @yank_action 'copy-pipe'
# tmux-yank ignores @yank_selection_mouse on Wayland, so the mouse binding
# lives in the copy mode section instead
set -g @yank_with_mouse 'off'
# Restore pane contents and Vim/Neovim sessions too
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# Save every 15 minutes and restore automatically when tmux starts
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Must stay at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
